version: '3.7'

services:
  ontodocker:
    container_name: ontodocker
    build: fastapi_app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./fastapi_app/app:/app
      - ./data:/data
    depends_on:
      - fuseki
    networks:
      - ontodocker-net
    ports:
      - "${ONTODOCKER_RUN_PORT}:8000"
#    restart: on-failure

  fuseki:
    image: secoresearch/fuseki:4.9.0
    container_name: fuseki
    volumes:
      - ./data/fuseki/shiro.ini:/jena-fuseki/shiro.ini
      - ./data/fuseki/databases:/fuseki-base/databases
      - ./data/fuseki/configuration:/fuseki-base/configuration
    user: root  
    environment:
      - JAVA_OPTIONS=-Xmx4096m -Xms4096m
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PW}
      - ENABLE_DATA_WRITE=true
      - ENABLE_UPDATE=true
      - ENABLE_UPLOAD=true
      - QUERY_TIMEOUT=60000 # in milliseconds (60 seconds by default)
    networks:
      - ontodocker-net
    #ports:
      #- "3030:3030"
    #restart: on-failure


networks:
  ontodocker-net:
    name: ontodocker-net
    driver: bridge
